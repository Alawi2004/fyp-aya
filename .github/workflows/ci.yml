name: CI

on:
  push:
  pull_request:

jobs:
  # ── Backend: lint + unit tests ───────────────────────────────────────────────
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ── Admin dashboard: lint ────────────────────────────────────────────────────
  admin-lint:
    name: Admin — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint

  # ── Camera server: lint (Python) ─────────────────────────────────────────────
  camera-lint:
    name: Camera — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: camera-aya
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: camera-aya/requirements.txt

      - run: pip install flake8
      - run: flake8 . --max-line-length=120 --extend-ignore=E402,W503,W504
